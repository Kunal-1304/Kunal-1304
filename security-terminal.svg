<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
<title id="title">Kunal Pawar cybersecurity terminal</title>
<desc id="desc">Animated terminal-style introduction for Kunal Pawar, a cybersecurity student focused on web security, VAPT, SOC and security automation.</desc>
<rect width="1000" height="280" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<rect width="1000" height="42" rx="14" fill="#161b22"/>
<rect y="28" width="1000" height="14" fill="#161b22"/>
<circle cx="24" cy="21" r="6" fill="#ff5f56"/><circle cx="46" cy="21" r="6" fill="#ffbd2e"/><circle cx="68" cy="21" r="6" fill="#27c93f"/>
<text x="92" y="26" font-family="monospace" font-size="15" fill="#8b949e">kunal@security-lab: ~/profile</text>
<g font-family="monospace" font-size="18">
<text x="38" y="78" opacity="0"><tspan fill="#7ee787">kunal@security-lab</tspan><tspan fill="#c9d1d9">:$ whoami</tspan><animate attributeName="opacity" begin=".2s" dur=".1s" to="1" fill="freeze"/></text>
<text x="38" y="106" fill="#c9d1d9" opacity="0">Kunal Pawar — Cybersecurity Student<animate attributeName="opacity" begin=".8s" dur=".1s" to="1" fill="freeze"/></text>
<text x="38" y="140" opacity="0"><tspan fill="#7ee787">kunal@security-lab</tspan><tspan fill="#c9d1d9">:$ focus</tspan><animate attributeName="opacity" begin="1.5s" dur=".1s" to="1" fill="freeze"/></text>
<text x="38" y="168" fill="#c9d1d9" opacity="0">Web Security • VAPT • SOC • Security Automation<animate attributeName="opacity" begin="2.1s" dur=".1s" to="1" fill="freeze"/></text>
<text x="38" y="202" opacity="0"><tspan fill="#7ee787">kunal@security-lab</tspan><tspan fill="#c9d1d9">:$ stack</tspan><animate attributeName="opacity" begin="2.8s" dur=".1s" to="1" fill="freeze"/></text>
<text x="38" y="230" fill="#c9d1d9" opacity="0">Python • Bash • Linux • Security Tooling<animate attributeName="opacity" begin="3.4s" dur=".1s" to="1" fill="freeze"/></text>
<text x="38" y="258" opacity="0"><tspan fill="#7ee787">kunal@security-lab</tspan><tspan fill="#c9d1d9">:$ </tspan><tspan fill="#58a6ff">building • testing • automating</tspan><tspan fill="#c9d1d9">█</tspan><animate attributeName="opacity" begin="4.1s" dur=".1s" to="1" fill="freeze"/><animate attributeName="opacity" values="1;0;1" dur="1s" begin="4.6s" repeatCount="indefinite"/></text>
</g>
</svg>